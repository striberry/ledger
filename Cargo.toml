[package]
name = "ledger"
version = "0.1.0"
edition = "2024"
description = "A lightweight CLI task tracker"
license = "MIT"

[[bin]]
name = "ledger"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
